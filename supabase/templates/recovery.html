<!--
  Password recovery email.

  The link deliberately does NOT use {{ .ConfirmationURL }}. That resolves to
  GoTrue's /verify endpoint, which redirects back carrying a PKCE `?code=` —
  and that code can only be exchanged against a verifier stored in the
  localStorage of the browser that requested the reset. Request on a laptop,
  open the mail on a phone (or in an email client's own in-app browser) and
  the link cannot complete. That is the single most common way people read
  their email.

  {{ .TokenHash }} carries its own proof, so the app can redeem it with
  verifyOtp from anywhere. See completeRecoveryLink in amuwak_core.

  {{ .RedirectTo }} is the origin the app passed to resetPasswordForEmail —
  the customer PWA for a customer, the staff PWA for a rider. It must not be
  hardcoded: both apps share this one template, and the project's Site URL can
  only name one of them.
-->
<h2>Set a new password</h2>

<p>
  We received a request to set a new password for your Amuwak account.
  Use the link below — it expires, and it works only once.
</p>

<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">
    Set a new password
  </a>
</p>

<p>
  If you did not ask for this, you can ignore this email. Your password stays
  as it is.
</p>
